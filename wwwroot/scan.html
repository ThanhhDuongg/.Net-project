<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Máy Quét Mã Vạch - Fashion WMS</title>
    <!-- QuaggaJS hoặc Html5-QRCode Scanner cho di động -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Microsoft SignalR JS Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: white; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #1e293b; padding: 16px; text-align: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 18px; font-weight: 700; color: #38bdf8; }
        header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        
        .status-bar {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            background: #eab308;
            color: #000;
            transition: 0.3s;
        }
        .status-connected { background: #22c55e !important; color: white !important; }

        #scanner-container {
            width: 100%;
            max-width: 480px;
            margin: 15px auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }

        #reader { width: 100%; }

        .result-panel {
            padding: 16px;
            max-width: 480px;
            margin: 0 auto 20px auto;
            width: 100%;
        }
        .last-code-card {
            background: #1e293b;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid #334155;
            text-align: center;
        }
        .last-code-card .label { font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .last-code-card .code { font-size: 24px; font-weight: 800; color: #38bdf8; margin: 8px 0; word-break: break-all; }
        .last-code-card .time { font-size: 11px; color: #64748b; }

        .manual-input {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }
        .manual-input input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 15px;
        }
        .manual-input button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .manual-input button:active { background: #1d4ed8; }
    </style>
</head>
<body>
    <header>
        <h1>📱 CAMERA QUÉT MÃ VẠCH (FASHION WMS)</h1>
        <p>Hướng camera vào mã vạch để gửi thẳng lên máy tính</p>
    </header>

    <div id="status" class="status-bar">Đang kết nối tới máy tính...</div>

    <div id="scanner-container">
        <div id="reader"></div>
    </div>

    <div class="result-panel">
        <div class="last-code-card">
            <div class="label">Mã vừa quét gần nhất:</div>
            <div id="last-code" class="code">---</div>
            <div id="last-time" class="time">Chưa có giao dịch</div>
        </div>

        <div class="manual-input">
            <input type="text" id="txtManualCode" placeholder="Hoặc nhập mã tay..." inputmode="numeric">
            <button onclick="sendManualCode()">Gửi mã</button>
        </div>
    </div>

    <script>
        // 1. Kết nối SignalR với Backend trên máy tính
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/hub/barcode")
            .withAutomaticReconnect()
            .build();

        const statusEl = document.getElementById("status");
        const lastCodeEl = document.getElementById("last-code");
        const lastTimeEl = document.getElementById("last-time");

        connection.start().then(() => {
            statusEl.textContent = "✔ ĐÃ KẾT NỐI VỚI MÁY TÍNH - SẴN SÀNG QUÉT";
            statusEl.classList.add("status-connected");
        }).catch(err => {
            statusEl.textContent = "❌ Lỗi kết nối SignalR: " + err;
            statusEl.style.background = "#ef4444";
        });

        connection.onreconnecting(() => {
            statusEl.textContent = "Đang kết nối lại...";
            statusEl.classList.remove("status-connected");
            statusEl.style.background = "#eab308";
        });

        connection.onreconnected(() => {
            statusEl.textContent = "✔ ĐÃ KẾT NỐI VỚI MÁY TÍNH - SẴN SÀNG QUÉT";
            statusEl.classList.add("status-connected");
        });

        // 2. Âm thanh Beep khi quét thành công
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(1800, ctx.currentTime);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) { }
            if (navigator.vibrate) navigator.vibrate(80);
        }

        let lastScannedCode = "";
        let lastScannedTime = 0;

        function handleBarcode(code) {
            const now = Date.now();
            // Tránh quét trùng lặp mã cùng loại trong vòng 2 giây
            if (code === lastScannedCode && (now - lastScannedTime) < 2000) {
                return;
            }

            lastScannedCode = code;
            lastScannedTime = now;

            lastCodeEl.textContent = code;
            lastTimeEl.textContent = "Đã gửi lúc: " + new Date().toLocaleTimeString();
            playBeep();

            // Gửi realtime qua SignalR tới máy tính
            if (connection.state === signalR.HubConnectionState.Connected) {
                connection.invoke("SendScannedBarcode", code).catch(err => console.error(err));
            }
        }

        function sendManualCode() {
            const input = document.getElementById("txtManualCode");
            const code = input.value.trim();
            if (code) {
                handleBarcode(code);
                input.value = "";
            }
        }

        // 3. Khởi tạo Camera Scanner (Hỗ trợ EAN-13, CODE-128, QR, v.v.)
        const html5QrCode = new Html5Qrcode("reader");
        const config = { 
            fps: 15, 
            qrbox: { width: 280, height: 160 },
            formatsToSupport: [ 
                Html5QrcodeSupportedFormats.EAN_13, 
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.UPC_A
            ]
        };

        Html5Qrcode.getCameras().then(cameras => {
            if (cameras && cameras.length) {
                // Ưu tiên camera sau (back/environment camera)
                html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText) => handleBarcode(decodedText),
                    () => {} // Bỏ qua frame chưa nhận diện
                ).catch(err => {
                    console.warn("Không mở được camera sau, thử camera mặc định", err);
                    html5QrCode.start(cameras[0].id, config, (decodedText) => handleBarcode(decodedText));
                });
            } else {
                statusEl.textContent = "Không tìm thấy camera trên thiết bị.";
            }
        }).catch(err => {
            console.error(err);
            statusEl.textContent = "Vui lòng cho phép quyền truy cập Camera trên điện thoại.";
        });
    </script>
</body>
</html>
